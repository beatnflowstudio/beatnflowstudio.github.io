<style>
  :root { --bg:#fafaf8; --fg:#16181d; --muted:#6b6f76; --line:#e6e4df; --card:#ffffff; --accent:#c22c26; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111317; --fg:#eceae6; --muted:#9a9ea6; --line:#262a31; --card:#181b20; }
  }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--fg); font:16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif;
         min-height:100vh; display:flex; flex-direction:column; -webkit-font-smoothing:antialiased; }
  main { width:100%; max-width:560px; margin:0 auto; padding:18vh 24px 48px; flex:1; }
  .mark { font-size:13px; letter-spacing:.18em; text-transform:uppercase; color:var(--muted); }
  h1 { font-size:clamp(36px, 8vw, 52px); line-height:1.05; font-weight:700; letter-spacing:-.03em; margin:14px 0 16px; }
  h1 em { font-style:normal; color:var(--accent); }
  .lead { color:var(--muted); font-size:17px; max-width:420px; }
  .label { margin-top:64px; font-size:13px; letter-spacing:.18em; text-transform:uppercase; color:var(--muted); }
  .app { display:flex; gap:16px; align-items:center; margin-top:14px; padding:18px; background:var(--card);
         border:1px solid var(--line); border-radius:18px; text-decoration:none; color:inherit; transition:transform .15s, border-color .15s; }
  .app:hover { transform:translateY(-2px); border-color:var(--muted); }
  .app img { width:56px; height:56px; border-radius:14px; flex:none; }
  .app b { display:block; font-weight:600; }
  .app span { color:var(--muted); font-size:14px; }
  .app .go { margin-left:auto; color:var(--muted); font-size:20px; }
  footer { max-width:560px; width:100%; margin:0 auto; padding:24px; border-top:1px solid var(--line);
           display:flex; flex-wrap:wrap; gap:8px 24px; font-size:14px; color:var(--muted); }
  footer a { color:inherit; text-decoration:none; }
  footer a:hover { color:var(--fg); }
</style>
