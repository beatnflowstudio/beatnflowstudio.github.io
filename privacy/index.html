<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Privacy policies · Beat &amp; Flow Studio</title>
<meta name="description" content="Privacy policies for the apps by Beat &amp; Flow Studio.">
<link rel="icon" href="../icon.png?v=2">
<style>
  :root { --bg:#fafaf8; --fg:#16181d; --muted:#6b6f76; --line:#e6e4df; --card:#ffffff; --accent:#c22c26; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111317; --fg:#eceae6; --muted:#9a9ea6; --line:#262a31; --card:#181b20; }
  }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--fg); font:16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif;
         min-height:100vh; display:flex; flex-direction:column; -webkit-font-smoothing:antialiased; }
  main { width:100%; max-width:560px; margin:0 auto; padding:12vh 24px 48px; flex:1; }
  .back { font-size:14px; color:var(--muted); text-decoration:none; }
  .back:hover { color:var(--fg); }
  .mark { margin-top:40px; font-size:13px; letter-spacing:.18em; text-transform:uppercase; color:var(--muted); }
  h1 { font-size:clamp(32px, 7vw, 44px); line-height:1.1; font-weight:700; letter-spacing:-.03em; margin:14px 0 12px; }
  .lead { color:var(--muted); font-size:17px; max-width:440px; }
  .list { margin-top:48px; display:flex; flex-direction:column; gap:12px; }
  .row { display:flex; align-items:center; gap:16px; padding:18px 20px; background:var(--card);
         border:1px solid var(--line); border-radius:18px; text-decoration:none; color:inherit; transition:transform .15s, border-color .15s; }
  .row:hover { transform:translateY(-2px); border-color:var(--muted); }
  .row b { display:block; font-weight:600; }
  .row span { color:var(--muted); font-size:14px; }
  .row .go { margin-left:auto; color:var(--muted); font-size:20px; }
  footer { max-width:560px; width:100%; margin:0 auto; padding:24px; border-top:1px solid var(--line);
           display:flex; flex-wrap:wrap; gap:8px 24px; font-size:14px; color:var(--muted); }
  footer a { color:inherit; text-decoration:none; }
  footer a:hover { color:var(--fg); }
</style>
</head>
<body>
<main>
  <a class="back" href="../">← Beat &amp; Flow Studio</a>
  <div class="mark">Privacy</div>
  <h1>Privacy policies</h1>

      <div class="go">→</div>
    </a>
  </div>
</main>
<footer>

</footer>
</body>
</html>
